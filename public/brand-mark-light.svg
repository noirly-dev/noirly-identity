<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Noirly Identity mark">
  <title>Noirly Identity — monochrome</title>
  <!-- Default tint for standalone use. Delete this rule to inherit color from the parent. -->
  <style>svg { color: #8a6b00; }</style>
  <defs>
    <!-- The seam: a keyed tab that mates with one socket and no other -->
    <mask id="nim-kerf">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M225 512 H444 A68 68 0 0 1 580 512 H799"
            fill="none" stroke="#000" stroke-width="30"/>
    </mask>
  </defs>
  <!-- Corner rounding comes from the round-joined stroke, not from arc segments -->
  <path d="M512 234 L753 373 L753 651 L512 790 L271 651 L271 373 Z"
        fill="currentColor" stroke="currentColor" stroke-width="60"
        stroke-linejoin="round" mask="url(#nim-kerf)"/>
</svg>
